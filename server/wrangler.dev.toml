name = "montaj-studio-local"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "montaj-studio-uploads"
