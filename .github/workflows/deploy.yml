# Tests, then deploys the app + API to Cloudflare Workers on every push to main.
# Repository secrets needed: CLOUDFLARE_API_TOKEN (Workers, R2, AI and Browser Rendering edit),
# CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY. Optional access code: `npx wrangler secret put ACCESS_CODE` once.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix app
          npm ci --prefix server
      - name: Test
        run: |
          npm test --prefix app
          npm test --prefix server
          npm run typecheck --prefix server
      - name: Build the app
        run: npm run build:app --prefix server
      - name: Create the R2 bucket if missing
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create montaj-studio-uploads || true
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
