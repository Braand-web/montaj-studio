# Tests, then deploys the app + API to Cloudflare Workers on every push to main.
# Repository secrets needed: CLOUDFLARE_API_TOKEN (Workers, R2, AI and Browser Rendering edit),
# CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY (+ D1 edit on the token). Billing with Stripe (optional):
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET. Optional access code: `npx wrangler secret put ACCESS_CODE` once.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix app
          npm ci --prefix server
      - name: Test
        run: |
          npm test --prefix app
          npm test --prefix server
          npm run typecheck --prefix server
      - name: Check the deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Cloudflare's own Git integration can deploy this repo; this job then only tests.
        id: secrets
        run: |
          ok=true
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY; do
            if [ -z "${!k}" ]; then echo "::notice::$k absent : déploiement laissé à l'intégration Git de Cloudflare"; ok=false; fi
          done
          echo "deploy=$ok" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: npm run build:app --prefix server
      - name: Create the R2 bucket if missing
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create montaj-studio-uploads || true
      - name: Apply the D1 migrations (credits, ledger, purchases)
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply montaj-studio --remote
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Stripe and key-vault secrets (only when set)
        if: steps.secrets.outputs.deploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          KEYS_SECRET: ${{ secrets.KEYS_SECRET }}
        run: |
          for k in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET KEYS_SECRET; do
            if [ -n "${!k}" ]; then printf '%s' "${!k}" | npx wrangler secret put "$k"; fi
          done
