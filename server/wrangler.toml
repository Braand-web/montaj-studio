# Montaj Studio — app + API on one Cloudflare Worker (same origin, no CORS).
name = "montaj-studio"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Attachments (images, videos, documents). Add a lifecycle rule in the dashboard to delete
# objects under u/ after 7 days.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "montaj-studio-uploads"

# Credits, usage ledger and purchases (see migrations/). Moves to Supabase with accounts later.
[[d1_databases]]
binding = "DB"
database_name = "montaj-studio"
database_id = "c62fd8ff-588a-49b6-af7b-1152a0783f80"
migrations_dir = "migrations"

# Audio transcription (Whisper) for video attachments.
[ai]
binding = "AI"

# Headless Chrome for link analysis (JavaScript sites, screenshots).
[browser]
binding = "BROWSER"

# 60 requests per minute per IP and route.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Send the root domain and www host through this Worker. DNS records for both
# names are already proxied through Cloudflare.
[[routes]]
pattern = "montajstudio.fun/*"
zone_name = "montajstudio.fun"

[[routes]]
pattern = "www.montajstudio.fun/*"
zone_name = "montajstudio.fun"

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODE            (optional: locks the AI and uploads behind a code)
#   npx wrangler secret put STRIPE_SECRET_KEY      (payments; without it the app shows "Paiement bientôt")
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET  (endpoint: https://<domain>/api/stripe/webhook)
# Stripe price ids of the monthly / yearly subscriptions (not secret):
[vars]
STRIPE_PRICE_CREATOR = ""
STRIPE_PRICE_PRO = ""
STRIPE_PRICE_TEAM = ""
STRIPE_PRICE_CREATOR_YEAR = ""
STRIPE_PRICE_PRO_YEAR = ""
STRIPE_PRICE_TEAM_YEAR = ""
