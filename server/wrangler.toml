# Montaj Studio — app + API on one Cloudflare Worker (same origin, no CORS).
name = "montaj-studio"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Attachments (images, videos, documents). Add a lifecycle rule in the dashboard to delete
# objects under u/ after 7 days.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "montaj-studio-uploads"

# Audio transcription (Whisper) for video attachments.
[ai]
binding = "AI"

# Headless Chrome for link analysis (JavaScript sites, screenshots).
[browser]
binding = "BROWSER"

# 60 requests per minute per IP and route.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secrets (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_CODE   (optional: locks the AI and uploads behind a code)
